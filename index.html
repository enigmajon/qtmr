<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mukhammadkodir@terminal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💻</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e14;
    --bg-panel: #0d1117;
    --bg-raised: #11161d;
    --border: #1f2732;
    --text: #c9d1d9;
    --text-dim: #6e7681;
    --text-bright: #f0f3f6;
    --accent: #58a6ff;
    --accent-dim: #3d6fa8;
    --green: #3fb950;
    --amber: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
    --font: 'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; }

  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(88, 166, 255, 0.08), transparent);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  ::selection {
    background: var(--accent-dim);
    color: var(--text-bright);
  }

  a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s ease;
  }
  a:hover, a:focus-visible {
    border-bottom-color: var(--accent);
  }
  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  /* ---------- Terminal window chrome ---------- */
  .terminal {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: var(--bg-raised);
    border-bottom: 1px solid var(--border);
  }

  .dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
  .dot.red { background: #ff5f56; }
  .dot.yellow { background: #ffbd2e; }
  .dot.green { background: #27c93f; }

  .titlebar-label {
    flex: 1;
    text-align: center;
    color: var(--text-dim);
    font-size: 12.5px;
    letter-spacing: 0.02em;
    padding-right: 48px;
  }

  .termbody {
    padding: 22px 22px 26px;
  }

  @media (max-width: 520px) {
    .termbody { padding: 18px 14px 22px; }
    .wrap { padding: 18px 10px 56px; }
  }

  /* ---------- Prompt lines ---------- */
  .prompt-line {
    display: flex;
    flex-wrap: wrap;
    gap: 0 8px;
    margin: 0 0 4px;
    font-size: 14px;
  }
  .prompt-user { color: var(--green); }
  .prompt-path { color: var(--accent); }
  .prompt-sym { color: var(--text-dim); }
  .prompt-cmd { color: var(--text-bright); font-weight: 500; }

  .output {
    margin: 0 0 28px;
    padding-left: 2px;
  }

  /* ---------- Nav (typed commands) ---------- */
  nav.cmdnav {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 4px;
    margin: 18px 0 30px;
  }
  nav.cmdnav button {
    font-family: var(--font);
    background: var(--bg-raised);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 13px;
    padding: 7px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  nav.cmdnav button:hover {
    border-color: var(--accent-dim);
    color: var(--text-bright);
  }
  nav.cmdnav button.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(88,166,255,0.08);
  }
  nav.cmdnav button .tilde { color: var(--text-dim); }

  /* ---------- Headings / labels ---------- */
  h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--text-bright);
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  h2 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-bright);
    margin: 0 0 14px;
  }
  .field {
    color: var(--text-dim);
  }
  .field-val { color: var(--text); }
  .comment { color: var(--text-dim); font-style: italic; }

  /* ---------- key: value rows ---------- */
  .kv {
    display: grid;
    grid-template-columns: 128px 1fr;
    gap: 6px 14px;
    margin: 14px 0 6px;
    font-size: 14px;
  }
  @media (max-width: 480px) {
    .kv { grid-template-columns: 1fr; gap: 2px; }
    .kv .field { margin-top: 8px; }
  }
  .kv .field::before { content: "$ "; color: var(--text-dim); }
  .kv .field { color: var(--purple); }

  /* ---------- status badge ---------- */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    padding: 4px 10px 4px 8px;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--bg-raised);
    color: var(--amber);
  }
  .badge .pulse {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--amber);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pulse { animation: none; }
  }

  /* ---------- timeline (log entries) ---------- */
  .log-entry {
    position: relative;
    padding: 0 0 22px 22px;
    border-left: 1px solid var(--border);
    margin-left: 5px;
  }
  .log-entry:last-child { border-left-color: transparent; padding-bottom: 0; }
  .log-entry::before {
    content: "";
    position: absolute;
    left: -5px;
    top: 4px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--bg-panel);
    border: 2px solid var(--accent-dim);
  }
  .log-entry.current::before {
    border-color: var(--green);
  }
  .log-date {
    color: var(--text-dim);
    font-size: 12.5px;
    letter-spacing: 0.02em;
  }
  .log-title {
    color: var(--text-bright);
    font-weight: 600;
    font-size: 14.5px;
    margin: 3px 0 5px;
  }
  .log-status {
    display: inline-block;
    font-size: 11.5px;
    padding: 1px 7px;
    border-radius: 4px;
    margin-left: 8px;
    vertical-align: 2px;
  }
  .log-status.ok { background: rgba(63,185,80,0.14); color: var(--green); }
  .log-status.warn { background: rgba(210,153,34,0.14); color: var(--amber); }
  .log-status.next { background: rgba(88,166,255,0.14); color: var(--accent); }
  .log-desc { color: var(--text); font-size: 14px; margin: 0; }

  /* ---------- social links ---------- */
  .sociallist {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .sociallist li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    transition: border-color 0.15s ease;
  }
  .sociallist li:hover { border-color: var(--accent-dim); }
  .sociallist li.inactive { opacity: 0.55; }
  .social-icon {
    width: 20px; height: 20px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim);
  }
  .social-main { flex: 1; min-width: 0; }
  .social-name { color: var(--text-bright); font-size: 14px; font-weight: 500; }
  .social-handle { color: var(--text-dim); font-size: 12.5px; display: block; margin-top: 1px; }
  .social-handle a { color: var(--text-dim); border: none; }
  .social-handle a:hover { color: var(--accent); }
  .status-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .status-tag.live { background: rgba(63,185,80,0.14); color: var(--green); }
  .status-tag.off { background: rgba(248,81,73,0.12); color: var(--red); }

  /* ---------- CV download block ---------- */
  .cv-block {
    margin-top: 24px;
    padding: 16px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    color: var(--text-dim);
    font-size: 13.5px;
  }
  .cv-block strong { color: var(--text); }

  /* ---------- principles list ---------- */
  .principles {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .principles li {
    display: flex;
    gap: 12px;
    padding: 13px 0;
    border-bottom: 1px solid var(--border);
  }
  .principles li:last-child { border-bottom: none; }
  .principle-mark {
    color: var(--green);
    flex-shrink: 0;
    padding-top: 1px;
  }
  .principle-text strong {
    color: var(--text-bright);
    display: block;
    font-size: 14.5px;
    margin-bottom: 2px;
  }
  .principle-text span {
    color: var(--text-dim);
    font-size: 13.5px;
  }

  /* ---------- footer ---------- */
  .footer {
    margin-top: 34px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 12.5px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .cursor {
    display: inline-block;
    width: 7px;
    height: 15px;
    background: var(--accent);
    margin-left: 4px;
    vertical-align: -2px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
  }

  .fadein {
    animation: fadein 0.25s ease;
  }
  @keyframes fadein {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .fadein { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="terminal">
    <div class="titlebar">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="titlebar-label">mukhammadkodir@portfolio: ~</span>
    </div>
    <div class="termbody" id="termbody">
      <!-- content injected by JS -->
    </div>
  </div>
  <div class="footer">
    <span>Tashkent, Uzbekistan</span>
    <span id="clock"></span>
  </div>
</div>

<script>
const state = { page: 'about' };

const pages = ['about', 'education', 'connect', 'principles'];
const pageMeta = {
  about:      { cmd: 'whoami', path: '~' },
  education:  { cmd: 'cat education.log', path: '~' },
  connect:    { cmd: 'ls -la socials/', path: '~' },
  principles: { cmd: 'cat principles.md', path: '~' },
};

function renderNav() {
  return `
    <nav class="cmdnav" role="tablist" aria-label="Site sections">
      ${pages.map(p => `
        <button role="tab" aria-selected="${state.page === p}" class="${state.page === p ? 'active' : ''}" onclick="goTo('${p}')">
          <span class="tilde">~/</span>${p}
        </button>
      `).join('')}
    </nav>
  `;
}

function renderAbout() {
  return `
    <h1>Mukhammadkodir Tokhirjonov<span class="cursor"></span></h1>
    <p class="comment">// aspiring software engineer, preparing in Tashkent</p>

    <div class="kv">
      <span class="field">major</span>
      <span class="field-val">Computer Science</span>
      <span class="field">target</span>
      <span class="field-val">University of Glasgow <span style="color:var(--text-dim)">(QS top-80, Russell Group)</span></span>
      <span class="field">status</span>
      <span class="badge"><span class="pulse"></span> applying for EYUF scholarship —  Upcoming cycle</span>
    </div>

    <div class="output" style="margin-top:26px;">
      <p style="margin:0;">
        I started university in Industrial Management/Engineering, learned quickly it wasn't the right
        fit, and left to pursue what I actually wanted to study: Computer Science / Software Engineering.
        I'm currently preparing for the EYUF interview and for the state scholarship to study CS
        at the University of Glasgow.
      </p>
    </div>
  `;
}

function renderEducation() {
  return `
    <h2><span style="color:var(--text-dim);">$</span> cat education.log</h2>
    <div class="log-entry">
      <div class="log-date">2022 &ndash; 2025</div>
      <div class="log-title">Norin District Specialized School <span class="log-status ok">graduated</span></div>
      <p class="log-desc">Physics &amp; Mathematics specialization. First formal exposure to Blender, Scratch, and Python &mdash; the point where a hobby started turning into a direction.</p>
    </div>
    <div class="log-entry">
      <div class="log-date">2025 &ndash; 2026</div>
      <div class="log-title">New Uzbekistan University <span class="log-status warn">left early</span></div>
      <p class="log-desc">Enrolled in Industrial Management / Engineering. Realized within the year it wasn't the right major &mdash; left to refocus fully on Computer Science / Software Engineering.</p>
    </div>
    <div class="log-entry current">
      <div class="log-date">Upcoming</div>
      <div class="log-title">University of Glasgow <span class="log-status next">applying</span></div>
      <p class="log-desc">BSc Computer Science. Applying for the EYUF (El-Yurt Umidi) scholarship in the upcoming cycle to fund the degree.</p>
    </div>
  `;
}

function renderPrinciples() {
  const items = [
    { title: 'No mindless scrolling', desc: 'Social media is a tool I use on purpose, not a default I fall into when bored.' },
    { title: 'Desexualizing my media diet', desc: 'Keeping what I consume clean and intentional, not algorithm-fed.' },
    { title: 'Run twice a week', desc: 'Physical discipline feeds mental discipline. Non-negotiable, not aspirational.' },
    { title: 'Build in public, slowly', desc: 'Progress over performance &mdash; consistent small output beats sporadic bursts.' },
    { title: 'Protect deep work blocks', desc: 'Study, code, or write without notifications pulling focus.' },
  ];
  return `
    <h2><span style="color:var(--text-dim);">$</span> cat principles.md</h2>
    <p class="comment" style="margin-top:-6px;">// not rules imposed on me &mdash; rules I chose</p>
    <ul class="principles">
      ${items.map(i => `
        <li>
          <span class="principle-mark">&#10003;</span>
          <span class="principle-text">
            <strong>${i.title}</strong>
            <span>${i.desc}</span>
          </span>
        </li>
      `).join('')}
    </ul>
  `;
}

const renderers = {
  about: renderAbout,
  education: renderEducation,
  connect: renderConnect,
  principles: renderPrinciples,
};

function goTo(page) {
  state.page = page;
  render();
  history.replaceState(null, '', '#' + page);
}

function render() {
  const meta = pageMeta[state.page];
  const el = document.getElementById('termbody');
  el.innerHTML = `
    <div class="prompt-line">
      <span class="prompt-user">mukhammadkodir@portfolio</span>
      <span class="prompt-sym">:</span>
      <span class="prompt-path">${meta.path}</span>
      <span class="prompt-sym">$</span>
      <span class="prompt-cmd">${meta.cmd}</span>
    </div>
    ${renderNav()}
    <div class="fadein">${renderers[state.page]()}</div>
  `;
}

// init from hash if present
const initial = location.hash.replace('#', '');
if (pages.includes(initial)) state.page = initial;
render();

// live clock
function tick() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('en-GB', { hour12: false });
}
tick();
setInterval(tick, 1000);
</script>
</body>
